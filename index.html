<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger Obsidian Pro Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-3 md:p-6">

    <!-- 備援檔案匯入 input -->
    <input type="file" id="legacyFileInput" accept=".json" class="hidden">
    <input type="file" id="importJsonInput" accept=".json" class="hidden">

    <div class="w-full max-w-lg obsidian-card rounded-[36px] p-5 md:p-7 flex flex-col h-[96vh] max-h-[960px] relative overflow-hidden">
        
        <!-- 頂部標題與總結餘 -->
        <div class="flex justify-between items-start mb-4">
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-lg font-black tracking-tight text-white">OBSIDIAN</h1>
                    <span class="text-[9px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 font-bold tracking-wider border border-emerald-500/30">ULTIMATE</span>
                </div>
                <!-- 狀態列與資料源切換 -->
                <div class="flex items-center gap-2 mt-2">
                    <button id="connectBtn" class="text-left">
                        <span id="statusBadge" class="flex items-center gap-2 px-3 py-1 bg-amber-500/10 border border-amber-500/20 text-amber-400 rounded-full text-[11px] font-semibold tap-effect">
                            <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> 連結/切換檔案
                        </span>
                    </button>
                    <!-- 資料管理選單彈窗按鈕 -->
                    <button id="dataMenuBtn" class="px-2.5 py-1 bg-white/5 hover:bg-white/10 border border-white/10 text-gray-300 rounded-full text-[11px] font-semibold tap-effect transition">
                        📂 匯入/匯出
                    </button>
                </div>
            </div>
            <div class="text-right">
                <span class="text-[10px] font-extrabold text-gray-500 uppercase tracking-widest block mb-1">NET BALANCE</span>
                <div id="netBalanceContainer" class="text-3xl font-black tracking-tight text-white">$0.00</div>
            </div>
        </div>

        <!-- 資料匯入/匯出控制面板 (預設隱藏，點擊按鈕展開) -->
        <div id="dataPanel" class="hidden mb-4 p-3.5 bg-black/60 border border-white/10 rounded-2xl spring-in space-y-2">
            <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest flex justify-between items-center">
                <span>Data Management Center</span>
                <button id="closeDataPanel" class="text-gray-500 hover:text-white">✕</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button id="exportJsonBtn" class="py-2 bg-white/5 hover:bg-white/10 border border-white/10 text-gray-200 rounded-xl text-xs font-bold tap-effect transition flex items-center justify-center gap-1.5">
                    💾 匯出 JSON 備份
                </button>
                <button id="exportCsvBtn" class="py-2 bg-white/5 hover:bg-white/10 border border-white/10 text-gray-200 rounded-xl text-xs font-bold tap-effect transition flex items-center justify-center gap-1.5">
                    📊 匯出 CSV 試算表
                </button>
                <button id="importJsonBtn" class="py-2 bg-white/5 hover:bg-white/10 border border-white/10 text-emerald-400 rounded-xl text-xs font-bold tap-effect transition flex items-center justify-center gap-1.5">
                    📥 匯入 JSON 檔案
                </button>
                <button id="clearDataBtn" class="py-2 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 text-rose-400 rounded-xl text-xs font-bold tap-effect transition flex items-center justify-center gap-1.5">
                    🗑️ 清空所有記錄
                </button>
            </div>
        </div>

        <!-- 儀表板快速摘要 (本月收入/支出統計) -->
        <div class="grid grid-cols-2 gap-2 mb-4">
            <div class="p-3 bg-white/[0.02] border border-white/[0.04] rounded-2xl flex items-center justify-between">
                <div>
                    <span class="text-[10px] font-bold text-gray-500 block">本月總收入</span>
                    <span id="monthIncome" class="text-xs font-extrabold text-emerald-400">$0.00</span>
                </div>
                <div class="w-7 h-7 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-400 text-xs">📈</div>
            </div>
            <div class="p-3 bg-white/[0.02] border border-white/[0.04] rounded-2xl flex items-center justify-between">
                <div>
                    <span class="text-[10px] font-bold text-gray-500 block">本月總支出</span>
                    <span id="monthExpense" class="text-xs font-extrabold text-rose-400">$0.00</span>
                </div>
                <div class="w-7 h-7 rounded-xl bg-rose-500/10 flex items-center justify-center text-rose-400 text-xs">📉</div>
            </div>
        </div>

        <!-- 記帳輸入卡片 -->
        <form id="ledgerForm" class="space-y-2.5 mb-4 input-glass p-3.5 rounded-[28px]">
            
            <div class="flex bg-black/40 p-1 rounded-2xl border border-white/5">
                <button type="button" id="typeExpense" class="flex-1 py-1.5 rounded-xl bg-white/10 text-white font-bold shadow-sm transition-all text-xs">支出</button>
                <button type="button" id="typeIncome" class="flex-1 py-1.5 rounded-xl text-gray-400 hover:text-white font-medium transition-all text-xs">收入</button>
            </div>

            <div>
                <div class="relative input-glass rounded-2xl overflow-hidden">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 font-bold text-lg">$</span>
                    <input type="number" id="amount" step="0.01" required placeholder="0.00" 
                        class="w-full pl-9 pr-4 py-2.5 bg-transparent text-white text-2xl font-black focus:outline-none tracking-tight">
                </div>
                
                <!-- 智慧微調快捷列 -->
                <div class="grid grid-cols-6 gap-1 mt-1.5">
                    <button type="button" data-action="-50" class="calc-btn py-1 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 rounded-xl text-[10px] font-bold text-rose-400 tap-effect">-50</button>
                    <button type="button" data-action="-10" class="calc-btn py-1 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 rounded-xl text-[10px] font-bold text-rose-400 tap-effect">-10</button>
                    <button type="button" data-action="+10" class="calc-btn py-1 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 rounded-xl text-[10px] font-bold text-emerald-400 tap-effect">+10</button>
                    <button type="button" data-action="+50" class="calc-btn py-1 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 rounded-xl text-[10px] font-bold text-emerald-400 tap-effect">+50</button>
                    <button type="button" data-action="+100" class="calc-btn py-1 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 rounded-xl text-[10px] font-bold text-emerald-400 tap-effect">+100</button>
                    <button type="button" data-action="+500" class="calc-btn py-1 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 rounded-xl text-[10px] font-bold text-emerald-400 tap-effect">+500</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <select id="category" class="w-full px-3 py-2 input-glass rounded-xl text-xs font-bold text-gray-200 focus:outline-none"></select>
                <input type="date" id="date" required 
                    class="w-full px-3 py-2 input-glass rounded-xl text-xs font-bold text-gray-200 focus:outline-none">
            </div>

            <div>
                <input type="text" id="note" placeholder="備註 (例如: 八達通, Mox, 咖啡)" 
                    class="w-full px-4 py-2 input-glass rounded-xl text-xs text-gray-200 font-medium focus:outline-none">
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3 bg-gradient-to-r from-gray-100 to-gray-300 text-gray-900 font-extrabold rounded-2xl transition hover:opacity-90 tap-effect text-xs tracking-wide shadow-lg shadow-white/5">
                確認記錄支出
            </button>
        </form>

        <!-- 歷史明細清單與搜尋列 -->
        <div class="flex-1 overflow-hidden flex flex-col">
            <div class="flex justify-between items-center mb-2 px-1 gap-2">
                <h2 class="text-[10px] font-black text-gray-500 uppercase tracking-widest shrink-0">TRANSACTIONS</h2>
                <!-- 搜尋列 -->
                <div class="relative flex-1 max-w-[200px]">
                    <input type="text" id="searchInput" placeholder="搜尋明細..." 
                        class="w-full px-3 py-1 bg-white/[0.03] border border-white/10 rounded-full text-[11px] text-gray-300 focus:outline-none focus:border-white/30">
                </div>
                <span id="recordCount" class="text-[11px] text-gray-500 font-bold shrink-0">0 筆</span>
            </div>
            
            <div id="recordList" class="flex-1 overflow-y-auto space-y-2 pr-1">
                <div class="text-center text-gray-500 text-xs py-12">✨ 載入中...</div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
