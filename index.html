<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Obsidian Ledger Quantum Pro X - Ultima Edition</title>
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen flex items-center justify-center p-0 md:p-4 relative overflow-hidden bg-black">

    <div class="quantum-mesh-bg top-[-80px] left-[-80px]"></div>
    <div class="quantum-mesh-bg bottom-[-80px] right-[-80px]" style="background: linear-gradient(135deg, rgba(48, 209, 88, 0.25), rgba(100, 210, 255, 0.25)); animation-delay: -7s;"></div>

    <input type="file" id="importJsonInput" accept=".json" class="hidden">

    <div class="w-full max-w-md quantum-glass md:rounded-[38px] p-3 md:p-4 flex flex-col h-[100dvh] md:h-[97vh] md:max-h-[970px] relative z-10 overflow-hidden justify-between">
        
        <div class="flex flex-col min-h-0 flex-shrink-0">
            <!-- Header -->
            <div class="flex justify-between items-center mb-2 pb-2 border-b border-white/10">
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-base font-black tracking-tight text-white">Obsidian Quantum</h1>
                        <span class="text-[8px] px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300 font-extrabold tracking-widest border border-blue-500/30">ULTIMA</span>
                    </div>
                    <!-- Navigation Bar -->
                    <div class="flex items-center gap-1 mt-1.5 overflow-x-auto no-scrollbar py-0.5">
                        <button id="menuConfig" class="px-2.5 py-1 bg-white/5 active:bg-white/20 border border-white/10 text-gray-200 rounded-full text-[10px] font-semibold transition shrink-0">⚙️ 系統</button>
                        <button id="menuCharts" class="px-2.5 py-1 bg-white/5 active:bg-white/20 border border-white/10 text-cyan-300 rounded-full text-[10px] font-semibold transition shrink-0">📊 圖表</button>
                        <button id="menuSub" class="px-2.5 py-1 bg-white/5 active:bg-white/20 border border-white/10 text-pink-300 rounded-full text-[10px] font-semibold transition shrink-0">🔁 訂閱</button>
                        <button id="menuDebt" class="px-2.5 py-1 bg-white/5 active:bg-white/20 border border-white/10 text-amber-300 rounded-full text-[10px] font-semibold transition shrink-0">💳 借貸</button>
                        <button id="menuWish" class="px-2.5 py-1 bg-white/5 active:bg-white/20 border border-white/10 text-purple-300 rounded-full text-[10px] font-semibold transition shrink-0">🎯 願望</button>
                    </div>
                </div>
                <div class="text-right shrink-0">
                    <span class="text-[8px] font-extrabold text-gray-400 uppercase tracking-widest block">NET WORTH</span>
                    <div id="netBalanceContainer" class="text-base md:text-lg font-black tracking-tight text-white">$0.00</div>
                </div>
            </div>

            <!-- Panels -->
            <!-- Config Panel -->
            <div id="panelConfig" class="hidden mb-2 p-3 bg-[#121216]/95 border border-white/20 rounded-[24px] space-y-2 z-40 shadow-2xl backdrop-blur-3xl">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest flex justify-between items-center">
                    <span>Data Center & UI Theme</span>
                    <button id="closeConfig" class="text-gray-400 hover:text-white px-2 font-bold text-base">✕</button>
                </div>
                <!-- Accent Theme Switcher -->
                <div class="flex items-center justify-between bg-white/5 p-2 rounded-xl border border-white/10 text-[10px]">
                    <span class="text-gray-300 font-bold">介面主題:</span>
                    <div class="flex items-center gap-2">
                        <button onclick="setTheme('cyan')" class="w-5 h-5 rounded-full bg-blue-500 ring-2 ring-white/20 hover:scale-110 transition"></button>
                        <button onclick="setTheme('emerald')" class="w-5 h-5 rounded-full bg-emerald-500 ring-2 ring-white/20 hover:scale-110 transition"></button>
                        <button onclick="setTheme('purple')" class="w-5 h-5 rounded-full bg-purple-500 ring-2 ring-white/20 hover:scale-110 transition"></button>
                        <button onclick="setTheme('amber')" class="w-5 h-5 rounded-full bg-amber-500 ring-2 ring-white/20 hover:scale-110 transition"></button>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-1.5">
                    <button id="exportJsonBtn" class="py-2 bg-white/5 border border-white/10 text-gray-200 rounded-xl text-[10px] font-bold active:scale-95 transition">💾 備份JSON</button>
                    <button id="exportCsvBtn" class="py-2 bg-white/5 border border-white/10 text-gray-200 rounded-xl text-[10px] font-bold active:scale-95 transition">📊 匯出CSV</button>
                    <button id="importJsonBtn" class="py-2 bg-white/5 border border-white/10 text-emerald-400 rounded-xl text-[10px] font-bold active:scale-95 transition">📥 還原備份</button>
                    <button id="budgetSettingBtn" class="py-2 bg-blue-500/10 border border-blue-500/20 text-blue-400 rounded-xl text-[10px] font-bold active:scale-95 transition">🎯 月預算</button>
                    <button id="helpNlpBtn" class="py-2 bg-purple-500/10 border border-purple-500/20 text-purple-300 rounded-xl text-[10px] font-bold active:scale-95 transition">🪄 語意手冊</button>
                    <button id="clearDataBtn" class="py-2 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-xl text-[10px] font-bold active:scale-95 transition">🗑️ 重置</button>
                </div>
            </div>

            <!-- Analytics Panel -->
            <div id="panelCharts" class="hidden mb-2 p-3 bg-[#121216]/95 border border-white/20 rounded-[24px] space-y-2 z-40 shadow-2xl backdrop-blur-3xl">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest flex justify-between items-center">
                    <span>Analytics</span>
                    <button id="closeCharts" class="text-gray-400 hover:text-white px-2 font-bold text-base">✕</button>
                </div>
                <div class="relative h-40 flex items-center justify-center">
                    <canvas id="analyticsChart"></canvas>
                </div>
            </div>

            <!-- Subscriptions Panel -->
            <div id="panelSub" class="hidden mb-2 p-3 bg-[#121216]/95 border border-white/20 rounded-[24px] space-y-2 z-40 shadow-2xl backdrop-blur-3xl">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest flex justify-between items-center">
                    <span>Recurring Subscriptions</span>
                    <button id="closeSub" class="text-gray-400 hover:text-white px-2 font-bold text-base">✕</button>
                </div>
                <div class="space-y-1.5 max-h-36 overflow-y-auto" id="subListContainer"></div>
                <div class="grid grid-cols-2 gap-1.5 pt-1">
                    <input type="text" id="subTitle" placeholder="服務名稱 (如 Netflix)" class="px-2.5 py-1.5 input-quantum rounded-xl text-xs text-gray-200 focus:outline-none">
                    <input type="number" id="subAmount" placeholder="月費" class="px-2.5 py-1.5 input-quantum rounded-xl text-xs text-gray-200 focus:outline-none">
                </div>
                <button id="addSubBtn" class="w-full py-2 bg-pink-500/20 border border-pink-500/40 text-pink-300 font-bold rounded-xl text-xs active:scale-95 transition">🔁 新增定期訂閱</button>
            </div>

            <!-- Debt Panel -->
            <div id="panelDebt" class="hidden mb-2 p-3 bg-[#121216]/95 border border-white/20 rounded-[24px] space-y-2 z-40 shadow-2xl backdrop-blur-3xl">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest flex justify-between items-center">
                    <span>Liabilities</span>
                    <button id="closeDebt" class="text-gray-400 hover:text-white px-2 font-bold text-base">✕</button>
                </div>
                <div class="space-y-1.5 max-h-36 overflow-y-auto" id="debtListContainer"></div>
                <div class="grid grid-cols-2 gap-1.5 pt-1">
                    <input type="text" id="debtTitle" placeholder="項目" class="px-2.5 py-1.5 input-quantum rounded-xl text-xs text-gray-200 focus:outline-none">
                    <input type="number" id="debtAmount" placeholder="金額" class="px-2.5 py-1.5 input-quantum rounded-xl text-xs text-gray-200 focus:outline-none">
                </div>
                <button id="addDebtBtn" class="w-full py-2 bg-amber-500/20 border border-amber-500/40 text-amber-300 font-bold rounded-xl text-xs active:scale-95 transition">➕ 新增債務</button>
            </div>

            <!-- Wish Panel -->
            <div id="panelWish" class="hidden mb-2 p-3 bg-[#121216]/95 border border-white/20 rounded-[24px] space-y-2 z-40 shadow-2xl backdrop-blur-3xl">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest flex justify-between items-center">
                    <span>Wishlist</span>
                    <button id="closeWish" class="text-gray-400 hover:text-white px-2 font-bold text-base">✕</button>
                </div>
                <div class="space-y-1.5 max-h-36 overflow-y-auto" id="wishListContainer"></div>
                <div class="grid grid-cols-2 gap-1.5 pt-1">
                    <input type="text" id="wishTitle" placeholder="目標" class="px-2.5 py-1.5 input-quantum rounded-xl text-xs text-gray-200 focus:outline-none">
                    <input type="number" id="wishTarget" placeholder="金額" class="px-2.5 py-1.5 input-quantum rounded-xl text-xs text-gray-200 focus:outline-none">
                </div>
                <button id="addWishBtn" class="w-full py-2 bg-purple-500/20 border border-purple-500/40 text-purple-300 font-bold rounded-xl text-xs active:scale-95 transition">🎯 新增願望</button>
            </div>

            <!-- Budget Bar -->
            <div class="mb-2 p-2.5 bg-white/[0.03] border border-white/[0.07] rounded-[22px] space-y-1">
                <div class="flex justify-between items-center text-[10px]">
                    <span class="text-gray-300 font-semibold">預算: <span id="budgetStatusText" class="text-white font-bold">$0 / $10,000</span></span>
                    <span id="budgetPercentage" class="text-emerald-400 font-bold">0%</span>
                </div>
                <div class="w-full bg-white/10 h-1.5 rounded-full overflow-hidden">
                    <div id="budgetProgressBar" class="bg-gradient-to-r from-blue-500 via-cyan-400 to-emerald-400 h-full w-0 rounded-full transition-all duration-500"></div>
                </div>
                <div class="grid grid-cols-2 gap-2 pt-1 border-t border-white/5 text-[10px]">
                    <div><span class="text-gray-400">本月收入: </span><span id="monthIncome" class="font-bold text-emerald-400">$0.00</span></div>
                    <div><span class="text-gray-400">本月支出: </span><span id="monthExpense" class="font-bold text-rose-400">$0.00</span></div>
                </div>
            </div>

            <!-- Fast One-Tap Presets Container -->
            <div class="mb-2 overflow-x-auto no-scrollbar flex items-center gap-1.5 py-0.5">
                <button onclick="quickLog('餐費', 45, '🍜 午餐', 'Octopus')" class="chip-btn px-2.5 py-1 rounded-full text-[10px] font-bold text-gray-200 shrink-0">🍜 午餐 $45</button>
                <button onclick="quickLog('交通', 15, '🚇 地鐵/巴士', 'Octopus')" class="chip-btn px-2.5 py-1 rounded-full text-[10px] font-bold text-cyan-300 shrink-0">🚇 交通 $15</button>
                <button onclick="quickLog('餐費', 38, '☕ 咖啡', 'Alipay')" class="chip-btn px-2.5 py-1 rounded-full text-[10px] font-bold text-amber-300 shrink-0">☕ 咖啡 $38</button>
                <button onclick="quickLog('網購', 100, '🛒 日用品/淘寶', 'Alipay')" class="chip-btn px-2.5 py-1 rounded-full text-[10px] font-bold text-purple-300 shrink-0">🛒 網購 $100</button>
            </div>

            <!-- Input Form -->
            <form id="ledgerForm" class="space-y-2 mb-2 input-quantum p-2.5 rounded-[24px]">
                <div class="flex bg-black/40 p-0.5 rounded-xl border border-white/5">
                    <button type="button" id="tabAi" class="flex-1 py-1.5 rounded-lg tab-active font-bold text-xs transition">🪄 AI 魔法速記</button>
                    <button type="button" id="tabManual" class="flex-1 py-1.5 rounded-lg text-gray-400 font-medium text-xs transition">✍️ 手動模式</button>
                </div>

                <div id="aiInputContainer" class="space-y-1.5">
                    <textarea id="aiText" rows="2" placeholder="自由輸入，例：$38 買Starbucks咖啡 支付寶 #下午茶" 
                        class="w-full px-2.5 py-1.5 input-quantum rounded-xl text-xs text-blue-200 focus:outline-none resize-none font-medium placeholder-gray-500"></textarea>
                    <button type="button" id="aiSubmitBtn" class="w-full py-2 bg-gradient-to-r from-blue-600 to-indigo-600 active:scale-[0.98] text-white font-bold rounded-xl text-xs shadow-md transition">
                        ✨ 智慧語意解析並記帳
                    </button>
                </div>

                <div id="manualInputContainer" class="hidden space-y-1.5">
                    <div class="flex bg-black/40 p-0.5 rounded-xl border border-white/5">
                        <button type="button" id="typeExpense" class="flex-1 py-1 rounded-lg bg-white/10 text-white font-bold text-[11px]">支出</button>
                        <button type="button" id="typeIncome" class="flex-1 py-1 rounded-lg text-gray-400 font-medium text-[11px]">收入</button>
                        <button type="button" id="typeTransfer" class="flex-1 py-1 rounded-lg text-gray-400 font-medium text-[11px]">帳戶互轉</button>
                    </div>

                    <div class="grid grid-cols-3 gap-1.5">
                        <div class="col-span-2 relative input-quantum rounded-xl overflow-hidden">
                            <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 font-bold text-xs">$</span>
                            <input type="number" id="amount" step="0.01" placeholder="0.00" class="w-full pl-6 pr-2 py-1.5 bg-transparent text-white text-sm font-black focus:outline-none">
                        </div>
                        <select id="currency" class="px-2 py-1.5 input-quantum rounded-xl text-xs font-bold text-blue-400 focus:outline-none">
                            <option value="HKD">🇭🇰 HKD</option>
                            <option value="RMB">🇨🇳 RMB</option>
                            <option value="USD">🇺🇸 USD</option>
                            <option value="JPY">🇯🇵 JPY</option>
                            <option value="TWD">🇹🇼 TWD</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-6 gap-1">
                        <button type="button" data-action="-50" class="calc-btn py-1 bg-rose-500/10 border border-rose-500/20 active:bg-rose-500/30 rounded-lg text-[9px] font-bold text-rose-400">-50</button>
                        <button type="button" data-action="-10" class="calc-btn py-1 bg-rose-500/10 border border-rose-500/20 active:bg-rose-500/30 rounded-lg text-[9px] font-bold text-rose-400">-10</button>
                        <button type="button" data-action="+10" class="calc-btn py-1 bg-emerald-500/10 border border-emerald-500/20 active:bg-emerald-500/30 rounded-lg text-[9px] font-bold text-emerald-400">+10</button>
                        <button type="button" data-action="+50" class="calc-btn py-1 bg-emerald-500/10 border border-emerald-500/20 active:bg-emerald-500/30 rounded-lg text-[9px] font-bold text-emerald-400">+50</button>
                        <button type="button" data-action="+100" class="calc-btn py-1 bg-emerald-500/10 border border-emerald-500/20 active:bg-emerald-500/30 rounded-lg text-[9px] font-bold text-emerald-400">+100</button>
                        <button type="button" data-action="+500" class="calc-btn py-1 bg-emerald-500/10 border border-emerald-500/20 active:bg-emerald-500/30 rounded-lg text-[9px] font-bold text-emerald-400">+500</button>
                    </div>

                    <div class="grid grid-cols-3 gap-1.5">
                        <select id="category" class="px-2 py-1.5 input-quantum rounded-xl text-xs font-bold text-gray-200 focus:outline-none"></select>
                        <select id="account" class="px-2 py-1.5 input-quantum rounded-xl text-xs font-bold text-gray-200 focus:outline-none">
                            <option value="Alipay">💙 支付寶</option>
                            <option value="WeChat">💚 微信支付</option>
                            <option value="FPS">⚡ 轉數快</option>
                            <option value="Cash">💵 現金</option>
                            <option value="Octopus">🚇 八達通</option>
                            <option value="CreditCard">💳 信用卡</option>
                        </select>
                        <input type="date" id="date" required class="px-1.5 py-1.5 input-quantum rounded-xl text-[10px] font-bold text-gray-200 focus:outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-1.5">
                        <input type="text" id="note" placeholder="備註" class="px-2 py-1.5 input-quantum rounded-xl text-xs text-gray-200 focus:outline-none">
                        <input type="text" id="tags" placeholder="標籤 (例: #旅遊)" class="px-2 py-1.5 input-quantum rounded-xl text-xs text-blue-300 focus:outline-none">
                    </div>

                    <button type="submit" id="submitBtn" class="w-full py-2 bg-gradient-to-r from-blue-600 to-indigo-600 active:scale-[0.98] text-white font-bold rounded-xl text-xs shadow-md transition">
                        確認記錄支出
                    </button>
                </div>
            </form>
        </div>

        <!-- Records List -->
        <div class="flex-1 overflow-hidden flex flex-col min-h-0">
            <div class="flex items-center justify-between gap-1 mb-1.5 px-0.5 flex-shrink-0">
                <div class="flex items-center gap-1">
                    <select id="filterAccount" class="bg-white/5 border border-white/10 rounded-lg text-[10px] text-gray-300 px-1 py-1 focus:outline-none max-w-[85px]">
                        <option value="ALL">全部帳戶</option>
                        <option value="Alipay">支付寶</option>
                        <option value="WeChat">微信</option>
                        <option value="FPS">轉數快</option>
                        <option value="Cash">現金</option>
                        <option value="Octopus">八達通</option>
                        <option value="CreditCard">信用卡</option>
                    </select>
                    <select id="sortOrder" class="bg-white/5 border border-white/10 rounded-lg text-[10px] text-gray-300 px-1 py-1 focus:outline-none max-w-[110px]">
                        <option value="manual">🖐️ 拖拽自訂排序</option>
                        <option value="date_desc">📅 日期 (最新)</option>
                        <option value="date_asc">📅 日期 (最舊)</option>
                        <option value="amount_desc">💰 金額 (高至低)</option>
                        <option value="amount_asc">💰 金額 (低至高)</option>
                    </select>
                </div>

                <div class="relative flex-1 max-w-[90px]">
                    <input type="text" id="searchInput" placeholder="搜尋..." 
                        class="w-full px-2 py-1 bg-white/5 border border-white/10 rounded-full text-[10px] text-gray-300 focus:outline-none">
                </div>
                <span id="recordCount" class="text-[10px] text-gray-400 font-bold shrink-0">0 筆</span>
            </div>
            
            <div id="recordList" class="flex-1 overflow-y-auto space-y-1.5 pr-0.5 relative touch-pan-y">
                <div class="text-center text-gray-500 text-xs py-8">✨ 載入中...</div>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script src="script.js"></script>
</body>
</html>
