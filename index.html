<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Obsidian Ledger Quantum Pro X</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        body { 
            font-family: 'SF Pro Display', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #030305;
            color: #f5f5f7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 沉浸式超炫光暈背景 */
        .quantum-mesh-bg {
            position: absolute;
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, rgba(0, 113, 227, 0.3), rgba(191, 90, 242, 0.3));
            filter: blur(90px);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            animation: pulseMesh 12s ease-in-out infinite alternate;
        }
        @keyframes pulseMesh {
            0% { transform: translate(-60px, -60px) scale(1); }
            100% { transform: translate(70px, 90px) scale(1.25); }
        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }

        .quantum-glass {
            background: rgba(18, 18, 22, 0.72);
            backdrop-filter: blur(60px);
            -webkit-backdrop-filter: blur(60px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .input-quantum {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.09);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .input-quantum:focus-within {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 113, 227, 0.9);
            box-shadow: 0 0 30px rgba(0, 113, 227, 0.35);
        }

        .quantum-spring { 
            animation: quantumSpring 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.25) forwards; 
        }
        @keyframes quantumSpring {
            0% { opacity: 0; transform: scale(0.94) translateY(14px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .quantum-shimmer {
            background: linear-gradient(90deg, #fff 0%, #70aeff 50%, #fff 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            animation: shimmerText 4s linear infinite;
        }
        @keyframes shimmerText {
            to { background-position: 200% center; }
        }

        .tab-active {
            background: linear-gradient(135deg, #0071e3, #4589ff);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 113, 227, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 md:p-4 relative overflow-hidden">

    <!-- 背景光暈 -->
    <div class="quantum-mesh-bg top-[-60px] left-[-60px]"></div>
    <div class="quantum-mesh-bg bottom-[-60px] right-[-60px]" style="background: linear-gradient(135deg, rgba(48, 209, 88, 0.25), rgba(100, 210, 255, 0.25)); animation-delay: -6s;"></div>

    <input type="file" id="importJsonInput" accept=".json" class="hidden">

    <div class="w-full max-w-md quantum-glass rounded-[42px] p-4 md:p-5 flex flex-col h-[97vh] max-h-[960px] relative z-10 overflow-hidden">
        
        <!-- 頂部標題與主選單列 -->
        <div class="flex justify-between items-center mb-2.5">
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-base font-black tracking-tight quantum-shimmer">Obsidian Quantum</h1>
                    <span class="text-[8px] px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300 font-extrabold tracking-widest border border-blue-500/30">PRO MAX</span>
                </div>
                <div class="flex items-center gap-1 mt-1.5 overflow-x-auto no-scrollbar py-0.5">
                    <button id="menuConfig" class="px-2.5 py-1 bg-white/5 hover:bg-white/10 border border-white/10 text-gray-200 rounded-full text-[10px] font-semibold transition active:scale-95 shrink-0">⚙️ 系統</button>
                    <button id="menuCharts" class="px-2.5 py-1 bg-white/5 hover:bg-white/10 border border-white/10 text-cyan-300 rounded-full text-[10px] font-semibold transition active:scale-95 shrink-0">📊 圖表</button>
                    <button id="menuDebt" class="px-2.5 py-1 bg-white/5 hover:bg-white/10 border border-white/10 text-amber-300 rounded-full text-[10px] font-semibold transition active:scale-95 shrink-0">💳 借貸/分期</button>
                    <button id="menuWish" class="px-2.5 py-1 bg-white/5 hover:bg-white/10 border border-white/10 text-purple-300 rounded-full text-[10px] font-semibold transition active:scale-95 shrink-0">🎯 願望清單</button>
                </div>
            </div>
            <div class="text-right shrink-0">
                <span class="text-[8px] font-extrabold text-gray-400 uppercase tracking-widest block mb-0.5">NET WORTH</span>
                <div id="netBalanceContainer" class="text-xl font-black tracking-tight text-white">$0.00</div>
            </div>
        </div>

        <!-- 系統彈窗：設定與備份中心 -->
        <div id="panelConfig" class="hidden mb-2.5 p-3.5 bg-[#121216]/95 border border-white/20 rounded-[28px] quantum-spring space-y-2.5 z-40 shadow-2xl backdrop-blur-3xl">
            <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest flex justify-between items-center">
                <span>Data & Vault Center</span>
                <button id="closeConfig" class="text-gray-400 hover:text-white px-2 py-0.5 font-bold">✕</button>
            </div>
            <div class="grid grid-cols-3 gap-1.5">
                <button id="exportJsonBtn" class="py-2 bg-white/5 hover:bg-white/10 border border-white/10 text-gray-200 rounded-xl text-[10px] font-bold transition">💾 備份JSON</button>
                <button id="exportCsvBtn" class="py-2 bg-white/5 hover:bg-white/10 border border-white/10 text-gray-200 rounded-xl text-[10px] font-bold transition">📊 匯出CSV</button>
                <button id="importJsonBtn" class="py-2 bg-white/5 hover:bg-white/10 border border-white/10 text-emerald-400 rounded-xl text-[10px] font-bold transition">📥 還原備份</button>
                <button id="budgetSettingBtn" class="py-2 bg-blue-500/10 hover:bg-blue-500/20 border border-blue-500/20 text-blue-400 rounded-xl text-[10px] font-bold transition">🎯 月度預算</button>
                <button id="helpNlpBtn" class="py-2 bg-purple-500/10 hover:bg-purple-500/20 border border-purple-500/20 text-purple-300 rounded-xl text-[10px] font-bold transition">🪄 語意手冊</button>
                <button id="clearDataBtn" class="py-2 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 text-rose-400 rounded-xl text-[10px] font-bold transition">🗑️ 重置數據</button>
            </div>
        </div>

        <!-- 系統彈窗：圖表分析中心 -->
        <div id="panelCharts" class="hidden mb-2.5 p-3.5 bg-[#121216]/95 border border-white/20 rounded-[28px] quantum-spring space-y-2 z-40 shadow-2xl backdrop-blur-3xl">
            <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest flex justify-between items-center">
                <span>Advanced Analytics</span>
                <button id="closeCharts" class="text-gray-400 hover:text-white px-2 py-0.5 font-bold">✕</button>
            </div>
            <div class="relative h-48 flex items-center justify-center">
                <canvas id="analyticsChart"></canvas>
            </div>
        </div>

        <!-- 系統彈窗：借貸/信用卡分期追蹤 -->
        <div id="panelDebt" class="hidden mb-2.5 p-3.5 bg-[#121216]/95 border border-white/20 rounded-[28px] quantum-spring space-y-2.5 z-40 shadow-2xl backdrop-blur-3xl">
            <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest flex justify-between items-center">
                <span>Liability & Installments</span>
                <button id="closeDebt" class="text-gray-400 hover:text-white px-2 py-0.5 font-bold">✕</button>
            </div>
            <div class="space-y-2 max-h-40 overflow-y-auto" id="debtListContainer">
                <!-- 動態注入借貸紀錄 -->
            </div>
            <div class="grid grid-cols-2 gap-1.5 pt-1">
                <input type="text" id="debtTitle" placeholder="項目 (例: iPhone 分期)" class="px-2.5 py-1.5 input-quantum rounded-xl text-[11px] text-gray-200 focus:outline-none">
                <input type="number" id="debtAmount" placeholder="總金額" class="px-2.5 py-1.5 input-quantum rounded-xl text-[11px] text-gray-200 focus:outline-none">
            </div>
            <button id="addDebtBtn" class="w-full py-2 bg-amber-500/20 border border-amber-500/40 text-amber-300 font-bold rounded-xl text-[11px] transition">➕ 新增分期/借貸債務</button>
        </div>

        <!-- 系統彈窗：願望清單儲蓄目標 -->
        <div id="panelWish" class="hidden mb-2.5 p-3.5 bg-[#121216]/95 border border-white/20 rounded-[28px] quantum-spring space-y-2.5 z-40 shadow-2xl backdrop-blur-3xl">
            <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest flex justify-between items-center">
                <span>Savings Wishlist Goals</span>
                <button id="closeWish" class="text-gray-400 hover:text-white px-2 py-0.5 font-bold">✕</button>
            </div>
            <div class="space-y-2 max-h-40 overflow-y-auto" id="wishListContainer">
                <!-- 動態注入願望 -->
            </div>
            <div class="grid grid-cols-2 gap-1.5 pt-1">
                <input type="text" id="wishTitle" placeholder="目標 (例: 日本旅遊)" class="px-2.5 py-1.5 input-quantum rounded-xl text-[11px] text-gray-200 focus:outline-none">
                <input type="number" id="wishTarget" placeholder="目標金額" class="px-2.5 py-1.5 input-quantum rounded-xl text-[11px] text-gray-200 focus:outline-none">
            </div>
            <button id="addWishBtn" class="w-full py-2 bg-purple-500/20 border border-purple-500/40 text-purple-300 font-bold rounded-xl text-[11px] transition">🎯 新增願望儲蓄目標</button>
        </div>

        <!-- 預算進度條與本月收支速覽 -->
        <div class="mb-2.5 p-3 bg-gradient-to-br from-white/[0.05] to-white/[0.02] border border-white/[0.07] rounded-[24px] space-y-1.5 shadow-inner">
            <div class="flex justify-between items-center text-[11px]">
                <span class="text-gray-300 font-semibold">本月預算消耗: <span id="budgetStatusText" class="text-white font-bold">$0 / $10,000</span></span>
                <span id="budgetPercentage" class="text-emerald-400 font-bold">0%</span>
            </div>
            <div class="w-full bg-white/10 h-1.5 rounded-full overflow-hidden p-[1px]">
                <div id="budgetProgressBar" class="bg-gradient-to-r from-blue-500 via-cyan-400 to-emerald-400 h-full w-0 rounded-full transition-all duration-700"></div>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-1 border-t border-white/5">
                <div>
                    <span class="text-[8px] font-semibold text-gray-400 block uppercase tracking-wider">本月收入</span>
                    <span id="monthIncome" class="text-xs font-black text-emerald-400">$0.00</span>
                </div>
                <div>
                    <span class="text-[8px] font-semibold text-gray-400 block uppercase tracking-wider">本月支出</span>
                    <span id="monthExpense" class="text-xs font-black text-rose-400">$0.00</span>
                </div>
            </div>
        </div>

        <!-- 智慧記帳面板 (AI 魔法 + 手動專業表單) -->
        <form id="ledgerForm" class="space-y-2 mb-2.5 input-quantum p-3 rounded-[32px]">
            <div class="flex bg-black/50 p-1 rounded-2xl border border-white/5">
                <button type="button" id="tabAi" class="flex-1 py-1.5 rounded-xl tab-active font-bold transition-all text-xs">🪄 AI 魔法自然語音速記</button>
                <button type="button" id="tabManual" class="flex-1 py-1.5 rounded-xl text-gray-400 font-medium transition-all text-xs">✍️ 高級手動模式</button>
            </div>

            <!-- AI 輸入區 -->
            <div id="aiInputContainer" class="space-y-2">
                <div class="relative">
                    <textarea id="aiText" rows="2" placeholder="自由輸入，例：$38 買Starbucks咖啡 支付寶 #下午茶 | 昨天搭地鐵14.5 八達通" 
                        class="w-full px-3 py-2 input-quantum rounded-2xl text-xs text-blue-200 focus:outline-none resize-none font-medium placeholder-gray-500"></textarea>
                </div>
                <button type="button" id="aiSubmitBtn" class="w-full py-2.5 bg-gradient-to-r from-blue-600 via-cyan-500 to-indigo-600 text-white font-bold rounded-2xl text-xs shadow-lg shadow-blue-500/25 active:scale-98 transition flex items-center justify-center gap-1.5">
                    ✨ 智慧語意解析並記帳
                </button>
            </div>

            <!-- 手動表單區 -->
            <div id="manualInputContainer" class="hidden space-y-2">
                <div class="flex bg-black/40 p-0.5 rounded-xl border border-white/5">
                    <button type="button" id="typeExpense" class="flex-1 py-1 rounded-lg bg-white/10 text-white font-bold transition-all text-[11px]">支出</button>
                    <button type="button" id="typeIncome" class="flex-1 py-1 rounded-lg text-gray-400 font-medium transition-all text-[11px]">收入</button>
                    <button type="button" id="typeTransfer" class="flex-1 py-1 rounded-lg text-gray-400 font-medium transition-all text-[11px]">帳戶互轉</button>
                </div>

                <div class="grid grid-cols-3 gap-1.5">
                    <div class="col-span-2 relative input-quantum rounded-2xl overflow-hidden">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 font-bold">$</span>
                        <input type="number" id="amount" step="0.01" placeholder="0.00" 
                            class="w-full pl-7 pr-3 py-1.5 bg-transparent text-white text-base font-black focus:outline-none">
                    </div>
                    <select id="currency" class="px-2 py-1.5 input-quantum rounded-2xl text-[11px] font-bold text-blue-400 focus:outline-none">
                        <option value="HKD">🇭🇰 HKD</option>
                        <option value="RMB">🇨🇳 RMB</option>
                        <option value="USD">🇺🇸 USD</option>
                        <option value="JPY">🇯🇵 JPY</option>
                        <option value="TWD">🇹🇼 TWD</option>
                    </select>
                </div>

                <!-- 金額快調按鈕 -->
                <div class="grid grid-cols-6 gap-1">
                    <button type="button" data-action="-50" class="calc-btn py-1 bg-rose-500/10 border border-rose-500/20 rounded-xl text-[9px] font-bold text-rose-400 active:scale-95 transition">-50</button>
                    <button type="button" data-action="-10" class="calc-btn py-1 bg-rose-500/10 border border-rose-500/20 rounded-xl text-[9px] font-bold text-rose-400 active:scale-95 transition">-10</button>
                    <button type="button" data-action="+10" class="calc-btn py-1 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-[9px] font-bold text-emerald-400 active:scale-95 transition">+10</button>
                    <button type="button" data-action="+50" class="calc-btn py-1 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-[9px] font-bold text-emerald-400 active:scale-95 transition">+50</button>
                    <button type="button" data-action="+100" class="calc-btn py-1 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-[9px] font-bold text-emerald-400 active:scale-95 transition">+100</button>
                    <button type="button" data-action="+500" class="calc-btn py-1 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-[9px] font-bold text-emerald-400 active:scale-95 transition">+500</button>
                </div>

                <div class="grid grid-cols-3 gap-1.5">
                    <select id="category" class="px-2 py-1.5 input-quantum rounded-2xl text-[11px] font-bold text-gray-200 focus:outline-none"></select>
                    <select id="account" class="px-2 py-1.5 input-quantum rounded-2xl text-[11px] font-bold text-gray-200 focus:outline-none">
                        <option value="Alipay">💙 支付寶</option>
                        <option value="WeChat">💚 微信支付</option>
                        <option value="FPS">⚡ 轉數快 (FPS)</option>
                        <option value="Cash">💵 現金</option>
                        <option value="Octopus">🚇 八達通</option>
                        <option value="CreditCard">💳 信用卡</option>
                    </select>
                    <input type="date" id="date" required class="px-2 py-1.5 input-quantum rounded-2xl text-[10px] font-bold text-gray-200 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-1.5">
                    <input type="text" id="note" placeholder="備註 (例: 晚餐, 奶茶)" class="px-2.5 py-1.5 input-quantum rounded-2xl text-xs text-gray-200 focus:outline-none">
                    <input type="text" id="tags" placeholder="標籤 (例: #美食 #網購)" class="px-2.5 py-1.5 input-quantum rounded-2xl text-xs text-blue-300 focus:outline-none">
                </div>

                <button type="submit" id="submitBtn" class="w-full py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold rounded-2xl transition hover:opacity-90 active:scale-98 text-xs shadow-lg shadow-blue-500/25">
                    確認記錄支出
                </button>
            </div>
        </form>

        <!-- 歷史交易紀錄清單 (帶有強大搜尋、篩選與分頁) -->
        <div class="flex-1 overflow-hidden flex flex-col">
            <div class="flex justify-between items-center mb-2 px-1 gap-1.5">
                <div class="flex items-center gap-1">
                    <h2 class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">LOGS</h2>
                    <select id="filterAccount" class="bg-white/5 border border-white/10 rounded-xl text-[10px] text-gray-300 px-2 py-0.5 focus:outline-none">
                        <option value="ALL">全部帳戶</option>
                        <option value="Alipay">支付寶</option>
                        <option value="WeChat">微信</option>
                        <option value="FPS">轉數快</option>
                        <option value="Cash">現金</option>
                        <option value="Octopus">八達通</option>
                        <option value="CreditCard">信用卡</option>
                    </select>
                </div>
                <div class="relative flex-1 max-w-[130px]">
                    <input type="text" id="searchInput" placeholder="搜尋項目/標籤..." 
                        class="w-full px-2 py-0.5 bg-white/5 border border-white/10 rounded-full text-[10px] text-gray-300 focus:outline-none">
                </div>
                <span id="recordCount" class="text-[9px] text-gray-400 font-bold shrink-0">0 筆</span>
            </div>
            
            <div id="recordList" class="flex-1 overflow-y-auto space-y-2 pr-1">
                <div class="text-center text-gray-500 text-xs py-12">✨ 載入中...</div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'obsidian_quantum_data_v4';
        const BUDGET_KEY = 'obsidian_quantum_budget_v4';
        const DEBT_KEY = 'obsidian_quantum_debt_v4';
        const WISH_KEY = 'obsidian_quantum_wish_v4';

        const EXCHANGE_RATES = { HKD: 1.0, RMB: 1.1, USD: 7.8, JPY: 0.052, TWD: 0.25 };

        const QuantumLedger = {
            expenses: [],
            debts: [],
            wishes: [],
            monthlyBudget: 10000,

            expenseCategories: [
                { name: '餐費', icon: '🍜', keywords: ['飯', '餐', '吃', '麵', '外賣', '下午茶', '咖啡', '早餐', '晚餐', '午餐', '餐廳', '麥當勞', 'kfc', '奶茶', 'starbucks'] },
                { name: '交通', icon: '🚇', keywords: ['車', '地鐵', '巴士', '港鐵', 'mrt', 'uber', '的士', '加油', '八達通', '去', '搭', '站', '46x', 'e33', 'a43'] },
                { name: '網購', icon: '🛍️', keywords: ['淘寶', '拼多多', '網購', '支付寶', '買', '蝦皮', 'momo', '京东'] },
                { name: '娛樂', icon: '🎮', keywords: ['電影', '遊戲', '玩', '手遊', 'netflix', 'spotify', 'ktv'] },
                { name: '居住', icon: '🏠', keywords: ['租金', '房租', '水費', '電費', '煤氣', '管理費'] },
                { name: '醫療', icon: '💊', keywords: ['醫生', '藥', '看病', '牙醫', '醫院'] },
                { name: '訂閱', icon: '📱', keywords: ['訂閱', 'icloud', 'google', 'gpt', '月費'] },
                { name: '健身', icon: '💪', keywords: ['健身', 'gym', '運動', '瑜伽'] },
                { name: '寵物', icon: '🐱', keywords: ['貓', '狗', '寵物', '獸醫'] },
                { name: '教育', icon: '📚', keywords: ['書', '課程', '學費'] },
                { name: '其他', icon: '📦', keywords: [] }
            ],
            incomeCategories: [
                { name: '薪金', icon: '💰', keywords: ['薪金', '薪水', '人工', '月薪', '公司'] },
                { name: '轉帳/收款', icon: '💙', keywords: ['轉帳', '收款', '紅包', 'fps', '轉數快'] },
                { name: '投資', icon: '📈', keywords: ['股票', '股息', '投資', '利息'] },
                { name: '兼職', icon: '💻', keywords: ['兼職', '外快', 'freelance'] },
                { name: '其他', icon: '✨', keywords: [] }
            ],

            init() {
                try {
                    const cached = localStorage.getItem(STORAGE_KEY);
                    if (cached) this.expenses = JSON.parse(cached);
                    const budgetCached = localStorage.getItem(BUDGET_KEY);
                    if (budgetCached) this.monthlyBudget = parseFloat(budgetCached);
                    const debtCached = localStorage.getItem(DEBT_KEY);
                    if (debtCached) this.debts = JSON.parse(debtCached);
                    const wishCached = localStorage.getItem(WISH_KEY);
                    if (wishCached) this.wishes = JSON.parse(wishCached);
                } catch (e) { console.error(e); }
            },

            save() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(this.expenses));
                    localStorage.setItem(BUDGET_KEY, this.monthlyBudget.toString());
                    localStorage.setItem(DEBT_KEY, JSON.stringify(this.debts));
                    localStorage.setItem(WISH_KEY, JSON.stringify(this.wishes));
                } catch (e) { console.error(e); }
            },

            convertToHKD(amount, currency) {
                return amount * (EXCHANGE_RATES[currency] || 1.0);
            },

            addRecord(item) {
                item.hkdAmount = this.convertToHKD(item.amount, item.currency);
                this.expenses.unshift(item);
                this.save();
            },

            deleteRecord(id) {
                this.expenses = this.expenses.filter(item => item.id !== id);
                this.save();
            },

            clearAll() {
                this.expenses = [];
                this.debts = [];
                this.wishes = [];
                this.save();
            },

            getMonthStats() {
                const currentMonth = new Date().toISOString().slice(0, 7);
                let income = 0, expense = 0;
                this.expenses.forEach(item => {
                    if (item.date && item.date.startsWith(currentMonth)) {
                        if (item.type === 'income') income += item.hkdAmount;
                        else if (item.type === 'expense') expense += item.hkdAmount;
                    }
                });
                return { income, expense };
            }
        };

        // 頂級自然語音 AI 辨識引擎
        function parseAiText(text) {
            text = text.trim();
            if (!text) return null;

            let type = 'expense';
            if (text.includes('收') || text.includes('人工') || text.includes('薪金') || text.includes('收入') || text.includes('紅包')) {
                type = 'income';
            }

            let amount = 0;
            const dollarMatch = text.match(/\$\s*(\d+(\.\d+)?)/);
            if (dollarMatch) {
                amount = parseFloat(dollarMatch[1]);
            } else {
                const matches = [...text.matchAll(/(\d+(\.\d+)?)/g)];
                if (matches.length > 0) amount = parseFloat(matches[0][1]);
            }

            if (!amount || isNaN(amount)) return null;

            let account = 'Alipay';
            if (text.includes('現金') || text.includes('現')) account = 'Cash';
            else if (text.includes('八達通')) account = 'Octopus';
            else if (text.includes('微信') || text.includes('wechat')) account = 'WeChat';
            else if (text.includes('fps') || text.includes('轉數快')) account = 'FPS';
            else if (text.includes('信用卡') || text.includes('card')) account = 'CreditCard';

            let tags = '';
            const tagMatch = text.match(/#\S+/g);
            if (tagMatch) tags = tagMatch.join(' ');

            let category = type === 'expense' ? '餐費' : '薪金';
            const categoriesList = type === 'expense' ? QuantumLedger.expenseCategories : QuantumLedger.incomeCategories;
            
            let matchedCategory = null;
            for (let cat of categoriesList) {
                for (let kw of cat.keywords) {
                    if (text.toLowerCase().includes(kw.toLowerCase())) {
                        matchedCategory = cat.name;
                        break;
                    }
                }
                if (matchedCategory) break;
            }
            if (matchedCategory) category = matchedCategory;

            let dateObj = new Date();
            if (text.includes('昨天')) dateObj.setDate(dateObj.getDate() - 1);
            else if (text.includes('前天')) dateObj.setDate(dateObj.getDate() - 2);
            const dateStr = dateObj.toISOString().slice(0, 10);

            let note = text.replace(/(?:\$|HK\$)?\s*\d+(\.\d+)?/g, '').replace(/#\S+/g, '').replace(/(昨天|今天|前天|現金|支付寶|微信|八達通|fps|收|買)/g, '').trim();
            if (!note) note = category;

            return {
                id: Date.now(),
                type,
                amount,
                currency: text.toLowerCase().includes('rmb') || text.includes('人民幣') ? 'RMB' : 'HKD',
                category,
                account,
                date: dateStr,
                note,
                tags
            };
        }

            const now = new Date().toISOString().slice(0, 7);
            const categoryTotals = {};
            QuantumLedger.expenses.forEach(item => {
                if (item.type === 'expense' && item.date.startsWith(now)) {
                    categoryTotals[item.category] = (categoryTotals[item.category] || 0) + item.hkdAmount;
                }
            });

            const labels = Object.keys(categoryTotals);
            const data = Object.values(categoryTotals);

            if (analyticsChartInstance) analyticsChartInstance.destroy();

            analyticsChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels.length ? labels : ['無消費記錄'],
                    datasets: [{
                        data: data.length ? data : [1],
                        backgroundColor: ['#0071e3', '#30d158', '#ff9f0a', '#ff453a', '#bf5af2', '#64d2ff', '#5856d6', '#ff375f', '#ac8e68', '#8e8e93'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#98989f', font: { size: 9 } } }
                    }
                }
            });
        }
    </script>
</body>
</html>
