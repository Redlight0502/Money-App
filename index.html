<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger Obsidian Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- 隱藏的傳統備援上傳檔案 input (適用於 Safari / 手機) -->
    <input type="file" id="legacyFileInput" accept=".json" class="hidden">

    <div class="w-full max-w-md obsidian-card rounded-[36px] p-6 flex flex-col h-[94vh] max-h-[900px] relative overflow-hidden">
        
        <!-- 頂部標題與總結餘 -->
        <div class="flex justify-between items-start mb-5">
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-lg font-black tracking-tight text-white">OBSIDIAN</h1>
                    <span class="text-[9px] px-2 py-0.5 rounded-full bg-white/10 text-gray-300 font-bold tracking-wider">PRO</span>
                </div>
                <button id="connectBtn" class="mt-2 text-left">
                    <span id="statusBadge" class="flex items-center gap-2 px-3 py-1 bg-amber-500/10 border border-amber-500/20 text-amber-400 rounded-full text-[11px] font-semibold tap-effect">
                        <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> 連結 ledger.json
                    </span>
                </button>
            </div>
            <div class="text-right">
                <span class="text-[10px] font-extrabold text-gray-500 uppercase tracking-widest block mb-1">NET BALANCE</span>
                <!-- 數字滾動容器 -->
                <div id="netBalanceContainer" class="text-3xl font-black tracking-tight text-white">$0.00</div>
            </div>
        </div>

        <!-- 記帳輸入卡片 -->
        <form id="ledgerForm" class="space-y-3 mb-5 input-glass p-4 rounded-[28px]">
            
            <div class="flex bg-black/40 p-1 rounded-2xl border border-white/5">
                <button type="button" id="typeExpense" class="flex-1 py-2 rounded-xl bg-white/10 text-white font-bold shadow-sm transition-all text-xs">支出</button>
                <button type="button" id="typeIncome" class="flex-1 py-2 rounded-xl text-gray-400 hover:text-white font-medium transition-all text-xs">收入</button>
            </div>

            <div>
                <div class="relative input-glass rounded-2xl overflow-hidden">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 font-bold text-lg">$</span>
                    <input type="number" id="amount" step="0.01" required placeholder="0.00" 
                        class="w-full pl-9 pr-4 py-3 bg-transparent text-white text-3xl font-black focus:outline-none tracking-tight">
                </div>
                
                <!-- 智慧微調快捷列 -->
                <div class="grid grid-cols-6 gap-1 mt-2">
                    <button type="button" data-action="-50" class="calc-btn py-1 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 rounded-xl text-[10px] font-bold text-rose-400 tap-effect">-50</button>
                    <button type="button" data-action="-10" class="calc-btn py-1 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 rounded-xl text-[10px] font-bold text-rose-400 tap-effect">-10</button>
                    <button type="button" data-action="+10" class="calc-btn py-1 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 rounded-xl text-[10px] font-bold text-emerald-400 tap-effect">+10</button>
                    <button type="button" data-action="+50" class="calc-btn py-1 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 rounded-xl text-[10px] font-bold text-emerald-400 tap-effect">+50</button>
                    <button type="button" data-action="+100" class="calc-btn py-1 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 rounded-xl text-[10px] font-bold text-emerald-400 tap-effect">+100</button>
                    <button type="button" data-action="+500" class="calc-btn py-1 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 rounded-xl text-[10px] font-bold text-emerald-400 tap-effect">+500</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <select id="category" class="w-full px-3 py-2.5 input-glass rounded-xl text-xs font-bold text-gray-200 focus:outline-none"></select>
                <input type="date" id="date" required 
                    class="w-full px-3 py-2.5 input-glass rounded-xl text-xs font-bold text-gray-200 focus:outline-none">
            </div>

            <div>
                <input type="text" id="note" placeholder="備註 (例如: 八達通, Mox, 咖啡)" 
                    class="w-full px-4 py-2.5 input-glass rounded-xl text-xs text-gray-200 font-medium focus:outline-none">
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3.5 bg-gradient-to-r from-gray-100 to-gray-300 text-gray-900 font-extrabold rounded-2xl transition hover:opacity-90 tap-effect text-xs tracking-wide shadow-lg shadow-white/5">
                確認記錄支出
            </button>
        </form>

        <!-- 歷史明細清單 -->
        <div class="flex-1 overflow-hidden flex flex-col">
            <div class="flex justify-between items-center mb-2 px-1">
                <h2 class="text-[10px] font-black text-gray-500 uppercase tracking-widest">TRANSACTIONS</h2>
                <span id="recordCount" class="text-[11px] text-gray-500 font-bold">0 筆明細</span>
            </div>
            <div id="recordList" class="flex-1 overflow-y-auto space-y-2 pr-1">
                <div class="text-center text-gray-500 text-xs py-16">請先點擊上方連結檔案</div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
